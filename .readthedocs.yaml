# Read the Docs build for the RoboForge SDK documentation (sdk/python/docs).
# Import this repository at https://readthedocs.org and it builds as is.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - libegl1          # MuJoCo is imported while the API pages are generated
    - libgl1

sphinx:
  configuration: sdk/python/docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: sdk/python/docs/requirements.txt
    - method: pip
      path: sdk/python
      extra_requirements: [all]
