[package]
name = "roboforge"
version = "0.1.0"
edition = "2021"
description = "RoboForge: a robotics IDE with isolated, side-by-side SDKs"

[dependencies]
roboforge-core = { path = "../roboforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[features]
# Native window instead of a browser tab: cargo build --release --features desktop
desktop = ["dep:tauri", "dep:tauri-build"]
