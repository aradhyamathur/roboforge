<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboForge</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f1ea; --panel: #fbf9f4; --raise: #ffffff; --line: #d9d4c7;
  --text: #23221f; --mute: #6b675e; --accent: #c2500a; --accent-ink: #ffffff;
  --ok: #2e7d3a; --bad: #b3261e; --sel: #f0e2d2;
  --kw: #a23b72; --str: #2e7d3a; --com: #8a857a; --num: #b05a00; --def: #1f5fa8;
  --sans: "IBM Plex Sans", "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #16171a; --panel: #1d1f23; --raise: #25282d; --line: #343840;
    --text: #e6e3dc; --mute: #9a968c; --accent: #ff8a3d; --accent-ink: #1a0f06;
    --ok: #7fc98a; --bad: #ff7a6e; --sel: #3a2c20;
    --kw: #e58fb6; --str: #9bd3a3; --com: #7d7a72; --num: #f0a868; --def: #86b7ee;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; }
#app { display: grid; grid-template-rows: 44px minmax(0, 1fr) auto; height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--mute); }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.quiet { background: none; border-color: transparent; color: var(--mute); padding: 2px 6px; }
button.quiet:hover { color: var(--text); }
button:disabled { opacity: .5; cursor: default; }
input[type=text], select { background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; min-width: 0; }
.mono { font-family: var(--mono); }
.mute { color: var(--mute); }
.grow { flex: 1; min-width: 0; }

header { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font: 700 15px var(--mono); letter-spacing: -.02em; margin-right: 6px; }
.brand b { color: var(--accent); }
.projname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 24ch; }
.badge { display: inline-block; font: 11px var(--mono); padding: 1px 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--mute); }
.badge.warn { color: var(--accent); border-color: var(--accent); }

main { min-height: 0; display: flex; }
.welcome { margin: auto; width: min(680px, 92vw); padding: 24px 0; }
.welcome h1 { font: 700 34px/1.1 var(--mono); letter-spacing: -.03em; margin: 0 0 10px; }
.welcome p { color: var(--mute); max-width: 60ch; margin: 0 0 22px; font-size: 14px; }
.welcome .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
.welcome .actions button { padding: 9px 16px; font-size: 14px; }
.recent button { display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tree { width: 250px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 6px 0; }
.tree .root { padding: 8px 12px 2px; font-weight: 600; color: var(--mute); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.tree .bar { display: flex; align-items: center; padding: 0 6px 4px 12px; color: var(--mute); }
.node { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 0; padding: 2px 8px; font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node:hover { background: var(--raise); }
.node.on { background: var(--sel); }
.node .tw { display: inline-block; width: 14px; color: var(--mute); }
.editor { flex: 1; min-width: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.notice { padding: 7px 12px; background: var(--sel); border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.tabs { display: flex; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 30px; }
.tab { display: flex; align-items: center; gap: 4px; padding: 0 4px 0 12px; border-right: 1px solid var(--line); font: 12px var(--mono); white-space: nowrap; cursor: pointer; color: var(--mute); }
.tab.on { background: var(--bg); color: var(--text); box-shadow: inset 0 2px 0 var(--accent); }
.edwrap { min-height: 0; position: relative; display: flex; }
.empty { margin: auto; color: var(--mute); text-align: center; }
.gutter { width: 48px; flex: none; text-align: right; padding: 8px 8px 8px 0; color: var(--mute); font: 12.5px/1.5 var(--mono); overflow: hidden; white-space: pre; user-select: none; background: var(--panel); }
textarea.code { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: var(--bg); padding: 8px; font: 12.5px/1.5 var(--mono); white-space: pre; tab-size: 4; }
.CodeMirror { flex: 1; min-width: 0; height: auto !important; font: 12.5px/1.5 var(--mono); background: var(--bg) !important; color: var(--text) !important; }
.CodeMirror-gutters { background: var(--panel) !important; border-right: 0 !important; }
.CodeMirror-linenumber { color: var(--mute) !important; }
.CodeMirror-cursor { border-left-color: var(--text) !important; }
.CodeMirror-selected { background: var(--sel) !important; }
.cm-keyword, .cm-tag { color: var(--kw) !important; } .cm-string, .cm-string-2 { color: var(--str) !important; }
.cm-comment { color: var(--com) !important; font-style: italic; } .cm-number, .cm-atom { color: var(--num) !important; }
.cm-def, .cm-attribute, .cm-builtin, .cm-variable-2 { color: var(--def) !important; } .cm-variable, .cm-property, .cm-operator { color: var(--text) !important; }

footer { border-top: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: 30px minmax(0, 1fr) auto; height: 240px; }
footer.shut { height: 30px; } footer.shut .log, footer.shut .console { display: none; }
.jobs { display: flex; align-items: center; overflow-x: auto; border-bottom: 1px solid var(--line); }
.jobs .tab { height: 29px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; }
.dot.run { background: var(--accent); animation: pulse 1.2s infinite; } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } }
.log { margin: 0; padding: 8px 12px; overflow: auto; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; background: var(--bg); }
.console { display: flex; gap: 6px; padding: 6px 8px; border-top: 1px solid var(--line); align-items: center; }
.console input { font-family: var(--mono); font-size: 12px; }

.veil { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; z-index: 10; }
.modal { margin: auto; width: min(980px, 94vw); max-height: 90vh; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.modal > h2 { margin: 0; padding: 12px 16px; font: 700 15px var(--mono); border-bottom: 1px solid var(--line); }
.modal > .body { overflow: auto; padding: 14px 16px; }
.modal > .foot { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
.field { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
h3 { font: 600 12px var(--sans); color: var(--mute); margin: 16px 0 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.card { text-align: left; padding: 9px 10px; border-radius: 6px; }
.card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.card strong { display: block; margin-bottom: 2px; } .card span { color: var(--mute); font-size: 12px; }
.comp { display: grid; grid-template-columns: 18px 1fr; gap: 6px; padding: 4px 0; align-items: start; }
.comp small { display: block; color: var(--mute); }
.status { font-size: 12px; } .status.bad { color: var(--bad); } .status.ok { color: var(--ok); }
.row { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
ol.plan { margin: 6px 0 0; padding-left: 20px; font-size: 12px; max-height: 90px; overflow: auto; }
.toast.good { border-color: var(--ok); }
details > summary { cursor: pointer; color: var(--mute); margin: 14px 0 4px; }
.toast { position: fixed; right: 16px; bottom: 16px; z-index: 20; background: var(--raise); border: 1px solid var(--bad); border-radius: 6px; padding: 9px 12px; max-width: 46ch; }
.term { overflow: auto; padding: 4px 12px; background: var(--bg); font: 12px/1.45 var(--mono); white-space: pre; outline: none; position: relative; cursor: text; }
.term .tl { min-height: 1.45em; } .term .cur { background: var(--text); color: var(--bg); }
.term:not(:focus) .cur { background: none; box-shadow: inset 0 0 0 1px var(--mute); }
footer.big { height: 60vh; }
footer.shut .term { display: none; }
.modal textarea { width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font: 12px/1.5 var(--mono); resize: vertical; }
.steps .row input[type=text] { font-size: 12px; } .steps .row { gap: 6px; }
.hint { color: var(--mute); font-size: 12px; margin: 2px 0 10px; }
#vscwrap { grid-row: 2; grid-column: 1; min-height: 0; display: none; background: var(--bg); z-index: 5; }
#vscwrap.on { display: block; } #vscwrap iframe { width: 100%; height: 100%; border: 0; display: block; }
header { grid-row: 1; grid-column: 1; } main { grid-row: 2; grid-column: 1; } footer { grid-row: 3; grid-column: 1; }
#vscbtn.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
header { overflow-x: auto; } header > button, header > select { flex: none; white-space: nowrap; } #runsel { max-width: 210px; }
</style>
</head>
<body>
<div id="app"><header id="hdr"></header><main id="main"></main><div id="vscwrap"></div><footer id="panel" class="shut"></footer></div>
<div id="modals"></div>
<script>
'use strict';
const TOKEN = '__RF_TOKEN__';
const S = { boot: null, proj: null, tabs: [], active: null, jobs: [], job: null, terms: [], term: null, termCur: null, tree: {}, open: new Set(['']), panelOpen: false, cm: false, polling: false };
const $ = (id) => document.getElementById(id);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k in el && k !== 'list') el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
async function api(path, body) {
  const r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-RF-Token': TOKEN }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error || 'request failed');
  return j;
}
function toast(msg, good) {
  const t = h('div', { class: 'toast' + (good ? ' good' : ''), role: good ? 'status' : 'alert', style: 'white-space:pre-wrap' }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 6000);
}
const guard = (fn) => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message); } };
const dir = () => S.proj.dir;

/* ---------- modal ---------- */
function modal(title, body, foot) {
  const veil = h('div', { class: 'veil', onmousedown: (e) => { if (e.target === veil) close(); } },
    h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, h('h2', {}, title), h('div', { class: 'body' }, body), h('div', { class: 'foot' }, foot)));
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  function close() { veil.remove(); document.removeEventListener('keydown', onKey); }
  document.addEventListener('keydown', onKey);
  $('modals').append(veil);
  const first = veil.querySelector('input, select, button');
  if (first) first.focus();
  return close;
}

function docsDialog() {
  const close = modal('RoboForge guide', h('iframe', { src: '/docs', title: 'RoboForge guide', style: 'width:100%;height:70vh;border:0;background:var(--bg)' }), [h('a', { href: '/docs', target: '_blank', rel: 'noopener', class: 'mute' }, 'Open in a browser tab'), h('span', { class: 'grow' }), h('button', { onclick: () => close() }, 'Close')]);
}
/* ---------- embedded VS Code (the user's own `code serve-web`) ---------- */
async function toggleVscode() {
  const wrap = $('vscwrap');
  if (S.vscOn) { S.vscOn = false; wrap.className = ''; renderHeader(); return; }
  const live = S.vsc && S.vsc.dir === dir() && S.jobs.some((j) => j.id === S.vsc.job && j.running);
  if (!live) {
    toast('Starting VS Code… the first start downloads its server and can take a minute.', true);
    const r = await api('vscode/start', { dir: dir() });
    if (!S.jobs.some((j) => j.id === r.job)) { const keep = [S.job, S.termCur, S.term, S.panelOpen]; addJob(r); [S.job, S.termCur, S.term, S.panelOpen] = keep; renderPanel(); }
    S.vsc = { dir: dir(), job: r.job, url: r.url };
    wrap.replaceChildren(h('iframe', { src: r.url, title: 'Visual Studio Code', allow: 'clipboard-read; clipboard-write; fullscreen' }));
  }
  S.vscOn = true; wrap.className = 'on'; renderHeader();
}
/* ---------- header ---------- */
function renderHeader() {
  const p = S.proj;
  const kids = [h('div', { class: 'brand' }, 'robo', h('b', {}, 'forge'))];
  const docsBtn = h('button', { class: 'quiet', id: 'docsbtn', title: 'Guide: opening a workspace, the Launch dialog, terminals', onclick: docsDialog }, 'Docs');
  if (p) {
    const lcs = p.project.launch || [];
    const sel = h('select', { id: 'runsel', 'aria-label': 'Run or launch configuration' },
      lcs.length ? h('optgroup', { label: 'Launch configurations' }, lcs.map((c) => h('option', { value: 'launch:' + c.name }, '🚀 ' + c.name))) : null,
      h('optgroup', { label: 'Run configurations' }, p.project.run.map((r) => h('option', { value: r.name }, r.name))));
    if (S.lastRun && [...sel.options].some((o) => o.value === S.lastRun)) sel.value = S.lastRun;
    else if (p.project.run.length) sel.value = p.project.run[0].name;
    kids.push(h('span', { class: 'projname', title: p.dir }, p.project.name), h('span', { class: 'grow' }),
      sel, h('button', { class: 'primary', id: 'runbtn', disabled: !p.project.run.length && !lcs.length, onclick: guard(() => { const v = $('runsel').value; return v.startsWith('launch:') ? runLaunch(v.slice(7)) : runConfig(v); }) }, '▶ Run'),
      h('button', { id: 'envbtn', onclick: guard(envDialog), title: 'ROS setup script, extra scripts to source, PATH, PYTHONPATH, build Python, variables' }, 'Environment'),
      h('button', { id: 'wsbtn', onclick: guard(workspacesDialog), title: 'Workspaces: separate folders for ROS, MAVSDK apps, sims, ML; reuse existing ones' }, 'Workspaces ', h('span', { class: 'badge' }, p.workspaces.length)),
      p.project.workspaces.some((w) => w.kind === 'app') ? h('button', { id: 'stackbtn', onclick: guard(stackDialog), title: 'What this SDK app is made of: robot, physics, links and the signals between them' }, 'Stack') : null,
      h('button', { id: 'vscbtn', class: S.vscOn ? 'on' : '', onclick: guard(toggleVscode), title: S.vscOn ? 'Back to the built-in editor (VS Code keeps running)' : 'Edit this project in VS Code, embedded here: extensions, IntelliSense, chat and agent extensions' }, S.vscOn ? '◧ Built-in editor' : '◧ VS Code'),
      h('button', { id: 'toolsbtn', onclick: guard(toolsDialog), title: 'Launch worlds, SLAM, navigation, teleop and viewers detected in this project' }, '🚀 Launch'),
      h('button', { id: 'modbtn', onclick: guard(modulesDialog), title: 'Mix modules into this project or take them out' }, 'Modules ', h('span', { class: 'badge' }, p.project.modules.length)),
      h('button', { id: 'syncbtn', onclick: guard(syncSdks), title: p.missing.length ? p.missing.join('\n') : 'All pinned SDKs are installed' },
        'Sync SDKs ', p.missing.length ? h('span', { class: 'badge warn' }, p.missing.length) : h('span', { class: 'badge' }, '✓')));
  } else kids.push(h('span', { class: 'grow' }));
  kids.push(h('button', { onclick: guard(sdkManager) }, 'SDK Manager'), h('button', { onclick: guard(newProject) }, 'New'), h('button', { onclick: guard(openDialog) }, 'Open'));
  kids.push(docsBtn);
  $('hdr').replaceChildren(...kids.filter(Boolean));
}

/* ---------- main: welcome / workspace ---------- */
function renderMain() {
  const m = $('main');
  if (!S.proj) {
    m.replaceChildren(h('div', { class: 'welcome' },
      h('h1', {}, 'One workspace for ROS, PX4 and your simulators.'),
      h('p', {}, 'A project is a mix of modules (MoveIt, Nav2, SLAM, MAVSDK, PX4, MuJoCo, Isaac Sim, PyTorch and your own) on the ROS distro you pick. Each module brings its SDKs; RoboForge installs them side by side under ' + S.boot.home + ' and never touches the system.'),
      h('div', { class: 'actions' }, h('button', { class: 'primary', onclick: guard(newProject) }, 'New project'), h('button', { onclick: guard(openDialog) }, 'Open project'), h('button', { onclick: guard(sdkManager) }, 'SDK Manager')),
      S.boot.recent.length ? h('div', { class: 'recent' }, h('h3', {}, 'Recent projects'), S.boot.recent.map((d) => h('button', { onclick: guard(() => openProject(d)) }, d))) : null));
    return;
  }
  m.replaceChildren(
    h('nav', { class: 'tree', id: 'tree', 'aria-label': 'Project files' }),
    h('section', { class: 'editor' }, h('div', { id: 'notice' }), h('div', { class: 'tabs', id: 'tabs', role: 'tablist' }), h('div', { class: 'edwrap', id: 'edwrap' })));
  renderNotice(); renderTree(); renderTabs(); mountEditor();
}
function renderNotice() {
  const n = $('notice'); if (!n) return;
  const p = S.proj;
  if (p.problem) n.replaceChildren(h('div', { class: 'notice' }, h('span', {}, 'SDK selection problem: ' + p.problem + ' Edit roboforge.json to fix it.')));
  else if (p.missing.length) n.replaceChildren(h('div', { class: 'notice' }, h('span', { class: 'grow' }, p.missing.length + ' SDK install step' + (p.missing.length > 1 ? 's are' : ' is') + ' pending for this project. Run configurations need them.'), h('button', { class: 'primary', onclick: guard(syncSdks) }, 'Sync SDKs')));
  else n.replaceChildren();
}

/* ---------- file tree ---------- */
// Roots: the project folder plus every external workspace (internal ones
// already show up inside the project). A node key is "<ws>|<path>", ws '' = project.
const key = (ws, path) => (ws == null ? '' : ws) + '|' + path;
const split = (k) => { const i = k.indexOf('|'); return { ws: k.slice(0, i) === '' ? null : Number(k.slice(0, i)), path: k.slice(i + 1) }; };
const roots = () => [{ ws: null, label: S.proj.project.name }, ...S.proj.workspaces.map((w, i) => ({ ws: i, label: w.kind + ' · ' + w.abs, ext: w.external })).filter((r) => r.ext)];
async function loadDir(k) { const { ws, path } = split(k); S.tree[k] = (await api('fs/list', { dir: dir(), ws, path })).entries; }
function renderTree() {
  const t = $('tree'); if (!t) return;
  const rows = [h('div', { class: 'bar' }, h('span', { class: 'grow' }, 'Files'),
    h('button', { class: 'quiet', title: 'New file', 'aria-label': 'New file', onclick: guard(newFile) }, '+'),
    h('button', { class: 'quiet', title: 'New ROS package', 'aria-label': 'New ROS package', id: 'pkgbtn', disabled: !S.proj.workspaces.some((w) => w.kind === 'ros2' || w.kind === 'ros1'), onclick: guard(newPackage) }, '⊞'),
    h('button', { class: 'quiet', title: 'Refresh', 'aria-label': 'Refresh file tree', onclick: guard(refreshTree) }, '↻'))];
  const walk = (ws, path, depth) => {
    for (const e of S.tree[key(ws, path)] || []) {
      const full = path ? path + '/' + e.name : e.name, k = key(ws, full);
      const isOpen = S.open.has(k);
      rows.push(h('button', { class: 'node' + (S.active === k ? ' on' : ''), style: 'padding-left:' + (8 + depth * 14) + 'px', title: full, 'data-path': ws == null ? full : null, 'data-key': k,
        onclick: guard(async () => { if (e.dir) { if (isOpen) S.open.delete(k); else { S.open.add(k); await loadDir(k); } renderTree(); } else await openFile(k); }) },
        h('span', { class: 'tw' }, e.dir ? (isOpen ? '▾' : '▸') : ''), e.name));
      if (e.dir && isOpen) walk(ws, full, depth + 1);
    }
  };
  for (const r of roots()) { if (roots().length > 1) rows.push(h('div', { class: 'root', title: r.label }, r.label)); walk(r.ws, '', 0); }
  t.replaceChildren(...rows);
}
async function refreshTree() { for (const r of roots()) S.open.add(key(r.ws, '')); for (const k of [...S.open]) await loadDir(k).catch(() => S.open.delete(k)); renderTree(); }
async function newFile() {
  const rel = prompt('New file, path relative to the project:', 'src/');
  if (!rel) return;
  await api('fs/write', { dir: dir(), path: rel, text: '', create: true });
  const parts = rel.split('/'); parts.pop();
  let acc = ''; for (const part of parts) { acc = acc ? acc + '/' + part : part; S.open.add(key(null, acc)); }
  await refreshTree(); await openFile(key(null, rel));
}
async function newPackage() {
  const ros = S.proj.workspaces.map((w, i) => ({ w, i })).filter((x) => x.w.kind === 'ros2' || x.w.kind === 'ros1');

  wsMode.addEventListener('change', () => { wsPath.style.display = wsMode.value === 'reuse' ? '' : 'none'; });
  const body = () => ({ ros: ros.value, modules: [...mods], components: [...extra], ros_workspace: ros.value && wsMode.value === 'reuse' ? wsPath.value : '' });
  const check = () => plan(body());
  const slug = () => name.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'project';
  const setLoc = () => { if (!touchedDir) loc.value = S.boot.default_dir + '/' + slug(); };
  const modPick = modulePicker(mods, check), extraPick = componentPicker(extra, check, true);
  const cards = h('div', { class: 'cards', role: 'radiogroup', 'aria-label': 'Preset' });
  const apply = () => {
    mods.clear(); extra.clear();
    preset.modules.forEach((m) => mods.add(m)); preset.components.forEach((c) => extra.add(c));
    const cur = rosComps.find((c) => c.id === ros.value);
    if (preset.ros === 'none') ros.value = '';
    else if (preset.ros === 'ros1') ros.value = 'ros1-noetic';
    else if (!cur || cur.ros_version !== 2) ros.value = 'ros2-jazzy';
    modPick.sync(); extraPick.sync(); check();
    cards.replaceChildren(...S.boot.presets.map((p) => h('button', { class: 'card' + (p === preset ? ' on' : ''), role: 'radio', 'data-preset': p.id, 'aria-checked': String(p === preset), onclick: () => { preset = p; apply(); } }, h('strong', {}, p.name), h('span', {}, p.summary))));
  };
  name.addEventListener('input', setLoc);
  loc.addEventListener('input', () => { touchedDir = true; });
  setLoc(); apply();
  /* Stack picker: a project built on the RoboForge SDK (simulator x middleware x autopilot link x robot). */
  const sk = {
    on: h('input', { type: 'checkbox', id: 'sk-on' }),
    sim: h('select', { id: 'sk-sim', 'aria-label': 'Simulator' }, h('option', { value: 'mujoco' }, 'MuJoCo'), h('option', { value: 'none' }, 'None (real robot or external simulator)')),
    robot: h('select', { id: 'sk-robot', 'aria-label': 'Robot' }, h('option', { value: 'quadrotor' }, 'Quadrotor'), h('option', { value: 'arm' }, 'Robot arm'), h('option', { value: 'diffdrive' }, 'Wheeled base (diff-drive)'), h('option', { value: 'custom' }, 'My own URDF / MJCF (arms, humanoids, anything)')),
    model: h('input', { type: 'text', id: 'sk-model', class: 'mono', placeholder: '~/robots/humanoid.urdf  or  model.xml', style: 'display:none' }),
    mav: h('select', { id: 'sk-mav', 'aria-label': 'Autopilot link' }, h('option', { value: 'none' }, 'None'), h('option', { value: 'vehicle' }, 'MAVLink vehicle (QGroundControl / MAVSDK connect, no PX4 needed)'),
      h('option', { value: 'hil' }, 'PX4 in the loop (needs a PX4 SITL build)'), h('option', { value: 'client' }, 'MAVLink client (talk to an existing autopilot)')),
    lang: h('select', { id: 'sk-lang', 'aria-label': 'Controller language' }, h('option', { value: 'python' }, 'Python'), h('option', { value: 'cpp' }, 'C++ (built for you on first run)')),
    note: h('div', { class: 'status', id: 'sk-note', role: 'status' }),
  };
  const stack = () => ({ sim: sk.sim.value, ros: !!ros.value && !ros.value.startsWith('ros1'), mavlink: sk.mav.value, robot: sk.sim.value === 'mujoco' ? sk.robot.value : '', model: sk.model.value.trim(), language: sk.lang.value });
  const stackProblem = (st) => {
    if (ros.value.startsWith('ros1')) return 'The SDK works with ROS 2, not ROS 1.';
    if (st.sim === 'mujoco') {
      if (st.robot === 'custom' && !st.model) return 'Give the path to your URDF or MJCF file.';
      if ((st.mavlink === 'vehicle' || st.mavlink === 'hil') && st.robot !== 'quadrotor') return 'MAVLink vehicle and PX4-in-the-loop fly a multirotor: pick the quadrotor.';
      if (st.mavlink === 'client') return 'A MAVLink client talks to an existing autopilot: pick "None" as the simulator.';
      if (st.language === 'cpp' && (st.mavlink === 'vehicle' || st.mavlink === 'hil')) return 'With a MAVLink vehicle or PX4 in the loop there is no controller of yours to write: pick Python.';
    } else {
      if (st.language === 'cpp') return 'A C++ controller needs the simulator.';
      if (st.mavlink === 'vehicle' || st.mavlink === 'hil') return 'MAVLink vehicle and PX4-in-the-loop need the MuJoCo simulator.';
      if (st.mavlink !== 'client' && !st.ros) return 'Without a simulator, pick a MAVLink client and/or ROS 2 to get state from.';
    }
    return '';
  };
  const stackSync = () => {
    const st = stack(), bad = sk.on.checked ? stackProblem(st) : '';
    sk.robot.disabled = st.sim !== 'mujoco';
    sk.model.style.display = st.sim === 'mujoco' && sk.robot.value === 'custom' ? '' : 'none';
    for (const el of [sk.sim, sk.robot, sk.model, sk.mav, sk.lang]) el.closest('.field').style.opacity = sk.on.checked ? '' : '.45';
    const parts = [st.sim === 'mujoco' ? 'MuJoCo' : null, st.ros ? 'ROS 2' : null, st.mavlink !== 'none' ? 'MAVLink' : null].filter(Boolean).join(' + ');
    sk.note.className = 'status ' + (bad ? 'bad' : 'mute');
    sk.note.textContent = !sk.on.checked ? 'Off: the project is made from the presets and modules below only.'
      : bad || 'Creates app/app.yaml (' + parts + ')' + (st.sim === 'mujoco' && st.mavlink !== 'hil' && st.mavlink !== 'vehicle' ? (st.language === 'cpp' ? ', app/controller.cpp with a starter controller in C++' : ', app/controller.py with a starter controller') : '') + (st.mavlink === 'vehicle' ? ', app/mission.py that flies it over MAVLink' : '') + ', and run + launch configurations.';
    return bad;
  };
  const combo = (label, sim, rosOn, mav, robot) => h('button', { class: 'quiet', 'data-combo': label, onclick: () => {
    sk.on.checked = true; sk.sim.value = sim; sk.mav.value = mav; if (robot) sk.robot.value = robot;
    if (rosOn && (!ros.value || ros.value.startsWith('ros1'))) ros.value = 'ros2-jazzy'; if (!rosOn) ros.value = '';
    stackSync(); check(); } }, label);
  for (const el of [sk.on, sk.sim, sk.robot, sk.model, sk.mav, sk.lang]) el.addEventListener('input', stackSync);
  ros.addEventListener('change', () => { check(); stackSync(); });
  const create = guard(async () => {
    const bad = stackSync();
    if (bad) { toast(bad); return; }
    const p = await api('project/new', { dir: loc.value, name: name.value, ...body(), ...(sk.on.checked ? { sdk: stack() } : {}) });
    close(); S.boot = await api('boot'); await openProject(p.dir);
    if (sk.on.checked) await stackDialog().catch(() => {});
  });
  const close = modal('New project', [
    h('label', { class: 'field' }, 'Name', name), h('label', { class: 'field' }, 'Location', loc), h('label', { class: 'field' }, 'ROS', ros),
    h('div', { class: 'field' }, 'ROS workspace', h('div', {}, wsMode, ' ', wsPath)),
    h('h3', {}, h('label', { style: 'cursor:pointer' }, sk.on, ' Build on the RoboForge SDK: one app, any combination')),
    h('p', { class: 'hint' }, 'A small Python framework where the simulator, ROS 2 and MAVLink are interchangeable parts wired through one bus. You get a config file, a starter controller you edit, and everything ready to run. Quick picks: ',
      combo('MuJoCo + ROS 2', 'mujoco', true, 'none', 'arm'), combo('MuJoCo + MAVLink', 'mujoco', false, 'vehicle', 'quadrotor'), combo('ROS 2 + MAVLink', 'none', true, 'client', ''), combo('All three', 'mujoco', true, 'vehicle', 'quadrotor')),
    h('label', { class: 'field' }, 'Simulator', sk.sim), h('label', { class: 'field' }, 'Robot', h('div', {}, sk.robot, ' ', sk.model)), h('label', { class: 'field' }, 'Autopilot link', sk.mav), h('label', { class: 'field' }, 'Your controller in', sk.lang),
    h('div', { class: 'field' }, 'Middleware', h('span', { class: 'mute' }, 'ROS 2 is on when a ROS 2 distro is selected above.')), sk.note,
    h('p', { class: 'mute' }, 'Other kinds of work get their own folders automatically: mav_ws/ for standalone MAVSDK and PX4 apps, sim/ for simulator assets, ml/ for training code, isaac/ for Isaac Sim. Change them later under Workspaces.'),
    h('h3', {}, 'Start from'), cards,
    h('h3', {}, 'Modules: mix any of these. Each brings its SDKs, files and run configurations, and more can be added later.'), modPick.el,
    h('details', {}, h('summary', {}, 'Extra SDK components (a specific PX4 or PyTorch build, source checkouts)'), extraPick.el)],
    [h('div', { class: 'grow' }, status), h('button', { onclick: () => close() }, 'Cancel'), h('button', { class: 'primary', id: 'np-create', onclick: create }, 'Create project')]);
  stackSync();
}
async function modulesDialog() {
  const p = S.proj.project;
  const mods = new Set(p.modules);
  const status = h('div', { class: 'status mute', id: 'md-status', role: 'status' });
  const plan = planStatus(status, 'project/plan');
  const ros = p.ros || (S.proj.components || []).find((c) => c.startsWith('ros')) || '';
  const check = () => plan({ ros, modules: [...mods], components: p.components.filter((c) => c !== ros) });
  const pick = modulePicker(mods, check);
  check();
  const applyChange = guard(async () => {
    if (S.tabs.some((t) => dirty(t))) throw new Error('Save or close your unsaved files first: applying modules rewrites roboforge.json and the package manifests.');
    const r = await api('project/modules', { dir: dir(), modules: [...mods] });
    close(); S.proj = r; renderHeader(); renderNotice(); await refreshTree(); await reloadTabs();
    const lines = ['Modules: ' + (r.project.modules.join(', ') || 'none')];
    if (r.written.length) lines.push('Created: ' + r.written.join(', '));
    if (r.left.length) lines.push('Left in place (delete if unwanted): ' + r.left.join(', '));
    toast(lines.join('\n'), true);
  });
  const close = modal('Modules in ' + p.name, [
    h('p', { class: 'mute' }, 'Adding a module creates its files (never overwriting yours), registers its nodes and dependencies in the package, and adds its run configurations. Removing one takes those out again but leaves its files. Your own modules live in ', h('span', { class: 'mono' }, S.boot.modules_dir), '.'),
    pick.el],
    [h('div', { class: 'grow' }, status), h('button', { onclick: () => close() }, 'Cancel'), h('button', { class: 'primary', id: 'md-apply', onclick: applyChange }, 'Apply')]);
}

/* ---------- SDK manager ---------- */
async function sdkManager() {
  S.boot = await api('boot');
  const selected = new Set();
  const status = h('div', { class: 'status mute', role: 'status' }, 'Tick components to install them together as one isolated environment.');
  const plan = planStatus(status, 'sdk/plan');
  const check = (components) => plan({ components });
  const installed = h('div', {});
  const drawInstalled = () => {
    const st = S.boot.state, rows = [];
    for (const [env, members] of Object.entries(st.envs)) rows.push(h('div', { class: 'row' }, h('span', { class: 'mono grow' }, env, h('small', { class: 'mute' }, '  ' + members.filter((m) => m !== '@created').join(', '))),
      h('button', { onclick: guard(async () => { if (!confirm('Delete environment ' + env + '? Projects pinned to it will need Sync SDKs again.')) return; S.boot.state = (await api('sdk/remove', { env })).state; drawInstalled(); }) }, 'Remove')));
    for (const id of st.sdks) rows.push(h('div', { class: 'row' }, h('span', { class: 'mono grow' }, 'source: ' + id),
      h('button', { onclick: guard(async () => { if (!confirm('Delete the ' + id + ' checkout?')) return; S.boot.state = (await api('sdk/remove', { sdk: id })).state; drawInstalled(); }) }, 'Remove')));
    installed.replaceChildren(...(rows.length ? rows : [h('p', { class: 'mute' }, 'Nothing installed yet. Creating a project and pressing Sync SDKs is the usual way to get started.')]));
  };
  drawInstalled();
  const picker = componentPicker(selected, () => check([...selected]));
  const install = guard(async () => { if (!(await check([...selected]))) return; const j = addJob(await api('sdk/install', { components: [...selected] })); j.refresh = true; close(); });
  const close = modal('SDK Manager', [
    h('p', { class: 'mute' }, 'SDK home: ', h('span', { class: 'mono' }, S.boot.home), '. ' + (S.boot.catalog_override ? 'Using your catalog.json override.' : 'To change versions or add components, put an edited copy of the catalog at catalog.json in this folder.')),
    h('h3', {}, 'Installed'), installed, h('h3', {}, 'Available'), picker.el],
    [h('div', { class: 'grow' }, status), h('button', { onclick: () => close() }, 'Close'), h('button', { class: 'primary', onclick: install }, 'Install selection')]);
}

/* ---------- boot ---------- */
function loadCodeMirror() {
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/';
  const script = (src) => new Promise((ok, no) => { const s = h('script', { src }); s.onload = ok; s.onerror = no; document.head.append(s); });
  const timeout = new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 2500));
  const load = (async () => {
    document.head.append(h('link', { rel: 'stylesheet', href: base + 'codemirror.min.css' }));
    await script(base + 'codemirror.min.js');
    await script(base + 'addon/mode/simple.min.js');  // the rust and toml modes are built on it
    await Promise.all(['python', 'xml', 'clike', 'cmake', 'shell', 'yaml', 'javascript', 'rust', 'toml', 'markdown'].map((m) => script(base + 'mode/' + m + '/' + m + '.min.js')));
    S.cm = true;
  })();
  return Promise.race([load, timeout]).catch(() => { S.cm = false; });  // offline: plain editor
}
async function boot() {
  try {
    [S.boot] = await Promise.all([api('boot'), loadCodeMirror()]);
    renderHeader(); renderMain(); renderPanel();
    setInterval(() => pollJobs(), 400);
    setInterval(() => pollTerms(), 60);
  } catch (e) { $('main').textContent = 'RoboForge backend is not reachable: ' + e.message; }
}
boot();
</script>
